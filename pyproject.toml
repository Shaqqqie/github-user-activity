[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "github-user-activity"
version = "0.1.0"
description = "A command-line tool for viewing Github user activity"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.17"
]

[project.scripts]
github-activity = "github_activity.__main__:main"

[tool.pytest.ini_options]
test_paths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
